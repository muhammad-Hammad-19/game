<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071b18">
  <meta name="description" content="Bat, bowl and chase in full cricket matches, a knockout cup, a league career and online duels.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Boundary Bash Cricket</title>
  <style>
    html, body { margin: 0; background: #071613; }
    .startup { min-height: 100dvh; display: grid; align-content: center; justify-items: center; color: #f8f5e9; font-family: system-ui, sans-serif; text-align: center; }
    .startup h1 { margin: 0; font: bold clamp(36px, 8vw, 80px)/1 Impact, sans-serif; }
    .startup h1 span { color: #f2bd55; }
    .startup p { color: #c3d0bc; }
    .startup a { color: #f2bd55; }
  </style>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&amp;family=DM+Sans:wght@400;500;600;700;800&amp;display=swap">
</head>
<body>
  <div id="root">
    <main class="startup">
      <h1>BOUNDARY <span>BASH</span></h1>
      <p role="status">Loading game menu…</p>
      <a href="" id="reload-game" hidden>Reload game</a>
      <noscript>Enable JavaScript to play.</noscript>
    </main>
  </div>
  <script>
    function offerReload() {
      const link = document.getElementById('reload-game')
      if (link) link.hidden = false
    }
    window.addEventListener('error', event => {
      if (event.target instanceof HTMLScriptElement) offerReload()
    }, true)
    window.setTimeout(offerReload, 15000)
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
